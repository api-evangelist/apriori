aid: apriori
name: aPriori
description: >-
  aPriori Technologies is a manufacturing insights software company founded in 2003 that simulates how a
  product will actually be made. Its platform ingests CAD geometry and returns should-cost estimates,
  design-for-manufacturability (DFM) guidance, routing and cycle-time analysis, and manufacturing carbon
  figures, so design, cost, sourcing and sustainability teams can act on production economics before
  tooling is cut. The product family covers aP Pro, aP Design, aP Generate, aP Analytics, aP Workspace and
  aiSource, delivered as aPriori Cloud or on-premise. Its public integration surface is aP Connect — a
  PLM/file-system connector plus a customer-installed Agent that carries a documented REST API for listing
  workflows, invoking REST-driven costing jobs, polling job state and retrieving per-part costing results,
  used to wire aPriori into Windchill, Teamcenter and file-system pipelines.
