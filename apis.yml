apis:
- name: aP Connect Agent REST API
  description: >-
    REST API served by the customer-installed aP Connect Agent. Retrieves Agent service configuration and
    status, lists aP Connect workflows, invokes workflow actions (run and runPartList — the REST-driven
    costing job that accepts an explicit component list plus costing inputs), lists and cancels workflow
    jobs, and returns costing results for a whole job or a single PLM part, including any User Defined
    Attributes configured on the workflow. Two published auth schemes — a JWT bearer Authorization header
    and a shared-secret `key` query parameter — with certificate-based mTLS added at the Connector level in
    June 2026.
  humanURL: https://docs.apriori.com/en/Connect/apc/rarg/overview/
  baseURL: http://localhost/api
  x-baseurl-note: >-
    NOT a placeholder. aPriori documents the base URL for this API as "localhost:<port_number>/" because the
    aP Connect Agent runs on a customer-managed host inside the customer's network; there is no
    vendor-hosted origin to point at. The Agent also publishes its own machine-readable spec at
    http://localhost:<port_number>/v4/api-docs, reachable only by a customer running the Agent.
  tags:
  - manufacturing
  - product-cost-management
  - plm-integration
  - workflow-automation
  - should-cost
