tool_count: 12
tools:
- {name: get_service_configuration, category: agent, rest: getServiceConfiguration, description: "Return the aP Connect Agent's configuration — PLM type, aP Connect and file-system connector host URLs, scan rate, reconnection interval, root folder path, max parts to return."}
- {name: get_service_status, category: agent, rest: getServiceStatus, description: "Return live Agent health — service status, aP Connect (CIC) connection status, PLM connection status, in-flight job count, service time."}
- {name: create_shutdown_nonce, category: agent, rest: createShutdownNonce, description: "Mint a single-use shutdownCode that must be presented back to authorise an Agent shutdown."}
- {name: initiate_shutdown, category: agent, rest: initiateShutdown, description: "Initiate Agent shutdown using a previously minted nonce. Only published mode is completeAndTerminate. DESTRUCTIVE."}
- {name: list_workflows, category: workflow, rest: listWorkflows, description: "List every workflow configured on this Agent, with id, name, description, locked flag and part-selection type."}
- {name: get_workflow, category: workflow, rest: getWorkflow, description: "Return details for one workflow by workflowIdentity."}
- {name: run_workflow, category: workflow, rest: runWorkflowAction, description: "Invoke a workflow. action=run starts a file-system or query-based job; action=runPartList starts a REST-driven job over an explicit component list with costingInputs. Returns a jobId. WRITE."}
- {name: list_workflow_jobs, category: workflow, rest: listWorkflowJobs, description: "List jobs for a workflow, with identity, status and output folder."}
- {name: get_workflow_job, category: workflow, rest: getWorkflowJob, description: "Return one job's state — status, startedAt, completedAt, component counters and any errorMessage. This is the polling call."}
- {name: cancel_workflow_job, category: workflow, rest: runWorkflowJobAction, description: "Run a job action. Only published action is cancel. WRITE."}
- {name: get_job_results, category: results, rest: getJobResults, description: "Return costing results for every part in a job, including all User Defined Attributes. Answers 409 while the job is non-terminal."}
- {name: get_part_results, category: results, rest: getPartResults, description: "Return costing results for one PLM part within a job, including all User Defined Attributes. Answers 409 while the job is non-terminal."}
input_schemas:
  source: openapi/apriori-ap-connect-agent.yml
  detail: >-
    Every tool above inherits its real inputSchema from the parameters and requestBody of the backing
    operation in the OpenAPI. Nothing is invented — see mcp/apriori-tool-crosswalk.yml for the binding.
agent_notes:
- Costing is asynchronous — run_workflow returns a jobId, then poll get_workflow_job until terminal before calling either results tool.
- A 409 from a results tool means "not finished yet", not "failed".
- initiate_shutdown and cancel_workflow_job are destructive and should be gated behind explicit human confirmation.
- run_workflow with runPartList must always include a costingInputs object on each part, even when empty.
- Results payloads are open objects carrying customer-defined attributes; do not assume a fixed field set.
