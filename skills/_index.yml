global_rules:
- The Agent is customer-hosted at localhost:<port_number>; the caller must be on a machine networked to it.
- Send Content-Type application/json on every request, including GETs — 415 is documented on all 12 operations.
- Prefer the JWT Bearer Authorization header over the `key` query parameter; query-string secrets are logged.
- Costing is fire-and-poll. A 409 from a results endpoint means "not finished", not "failed".
- No idempotency key exists. Retrying an invocation can start a second job; reconcile on jobId.
- No error body is published for any status — branch on the HTTP status code alone.
- Per-component failures arrive inside a 200 as errorMessage / cicStatus, not as HTTP errors.
- Results payloads carry the customer's User Defined Attributes, so treat them as open objects.
